<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BioVerso: explore vírus, bactérias e órgãos do corpo humano em 3D." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <title>BioVerso</title>
    <script>
      // aplica o tema antes da primeira pintura, para a página não piscar no tema errado (ver src/tema.js)
      try {
        document.documentElement.dataset.tema =
          localStorage.getItem('bioverso-tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro');
      } catch {
        document.documentElement.dataset.tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      }
    </script>
  </head>
  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <header class="topo">
      <a class="marca" href="#/">
        <svg class="marca__icone" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5" />
          <circle cx="16" cy="16" r="5" fill="var(--eosina)" />
          <circle cx="23" cy="10" r="2.2" fill="var(--hematoxilina)" />
        </svg>
        BioVerso
      </a>
      <nav aria-label="Principal">
        <a href="#/#virus">Vírus</a>
        <a href="#/#bacteria">Bactérias</a>
        <a href="#/#orgao">Órgãos</a>
        <a href="#/doencas">Doenças</a>
      </nav>
      <button type="button" class="tema" data-botao-tema aria-pressed="false" aria-label="Modo escuro" title="Alternar modo escuro">
        <svg class="tema__lua" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        </svg>
        <svg class="tema__sol" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <main id="conteudo" tabindex="-1"></main>

    <footer class="rodape">
      <p><strong>BioVerso</strong> é um projeto acadêmico de computação gráfica.</p>
      <p>O conteúdo é educativo e não substitui orientação de profissionais de saúde. Em emergências, ligue 192.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
